# Legacy full-feature C; the paper-facing temporal setup is setup_C_no_token_accounting.yaml.
extends: common.yaml
name: C
features: [repo, new]
split:
  kind: temporal
  train_end: "2022-01-01"   # train: t0 <  2022-01-01 (and label horizon ends before it)
  val_end: "2022-07-01"     # val:   2022-01-01 <= t0 < 2022-07-01
  test_end: null            # test:  t0 >= 2022-07-01
  purge: true
train: {shap: true}
